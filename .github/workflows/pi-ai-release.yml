name: pi-ai release

# Supervisoor's gateway installs @oh-my-pi/pi-ai from this release's tarball.
# Tag pi-ai-v<packages/ai version>-supervisoor.<n> on the supervisoor branch.
on:
   push:
      tags: ["pi-ai-v*-supervisoor.*"]

permissions:
   contents: write

jobs:
   release:
      runs-on: ubuntu-24.04
      timeout-minutes: 10
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
           with:
              persist-credentials: false
         - name: Pack and release
           env:
              GH_TOKEN: ${{ github.token }}
              TAG: ${{ github.ref_name }}
              BUN_IMAGE: oven/bun:1.3.14@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
           run: |
              version=$(jq -r .version packages/ai/package.json)
              case "$TAG" in
                 "pi-ai-v$version-supervisoor."*) ;;
                 *) echo "tag $TAG does not match packages/ai version $version" >&2; exit 1 ;;
              esac
              docker run --rm -v "$PWD:/w" -w /w/packages/ai "$BUN_IMAGE" bun pm pack --destination /w/dist
              (cd dist && sha256sum ./*.tgz > SHA256SUMS)
              gh release create "$TAG" dist/*.tgz dist/SHA256SUMS --title "$TAG" \
                 --notes "@oh-my-pi/pi-ai $version with Supervisoor's gateway changes ($GITHUB_SHA)."
